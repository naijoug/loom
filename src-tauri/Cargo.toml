[package]
name = "loom"
default-run = "loom"
version = "0.1.0"
description = "A desktop workbench for orchestrating local coding agents"
authors = ["naijoug"]
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "loom"
path = "src/main.rs"

[[bin]]
name = "loom-skills"
path = "src/bin/loom-skills.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] } # Fixed-host GitHub API reads; already used by the updater.
rustls = { version = "0.23", default-features = false, features = ["ring"] } # Same TLS provider as the updater.
base64 = "0.22" # GitHub blob payloads, including binary assets.
sha1 = "0.10" # Verify Git object identities, not cryptographic authentication.
dirs = "6" # Match Tauri path resolution without creating an AppHandle.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10" # Bind native chat sessions without persisting raw execution configuration.
tokio = { version = "1", features = ["io-util", "macros", "process", "signal", "sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"


[dev-dependencies]
pulldown-cmark = "0.11" # Verify exported Markdown remains inert.
