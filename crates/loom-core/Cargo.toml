[package]
name = "loom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
bindings = ["dep:ts-rs"]

[dependencies]
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "export-workbench-types"
path = "src/bin/export-workbench-types.rs"
required-features = ["bindings"]
