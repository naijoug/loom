name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

  browser-regression:
    if: github.event_name != 'pull_request'
    needs: quality-gate
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run browser smoke suites
        run: |
          pnpm smoke
          pnpm smoke:interaction
          pnpm smoke:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-${{ github.run_id }}
          path: /tmp/loom-visual-smoke
          if-no-files-found: ignore
          retention-days: 7

  desktop-compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality-gate
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release desktop bundle
        run: pnpm tauri build

      - name: Verify desktop launch and restart
        run: pnpm smoke:desktop

      - name: Upload desktop smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ github.run_id }}
          path: /tmp/loom-desktop-smoke.*
          if-no-files-found: ignore
          retention-days: 7
