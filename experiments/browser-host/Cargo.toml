[package]
name = "loom-browser-host-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "loom-browser-host"
path = "src/main.rs"

[[bin]]
name = "loom-browser-helper"
path = "src/bin/loom_browser_helper.rs"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]
linux-x11 = ["dep:x11-dl"]

[package.metadata.cef.bundle]
helper_name = "loom-browser-helper"
resources_path = "../../designs/craft-v0.14.0/cef-probe-resources"

[dependencies]
cef = { version = "=154.3.0", default-features = false, features = ["build-util"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSResponder", "NSUserInterfaceValidation", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { version = "2", optional = true }
