<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loom · 多 Agent 编程工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style id="theme-vars">
/* Loom — Dark Technical Workbench
   设计令牌：深色优先，Linear/Claude 桌面端风格
   等宽字体强调日志/代码，Agent 各自配色编码 */

:root {
  /* 品牌主色 — 冷调天蓝，用于链接/active/主操作 */
  --loom-accent: #97C9F8;
  --loom-accent-ink: #0B1F33;
  --loom-accent-fill: #2F6FB0;
  --loom-accent-soft: rgba(151, 201, 248, 0.14);

  /* 背景层级 */
  --loom-bg: #181818;
  --loom-bg-2: #1F1F1F;
  --loom-sidebar: #272727;
  --loom-surface: #222222;
  --loom-surface-2: #2D2D2D;
  --loom-inset: #303030;
  --loom-selected: #3B3D41;
  --loom-hover: #2E2E2E;
  --loom-border: #2F2F2F;
  --loom-border-strong: #3A3A3C;

  /* 文字层级 */
  --loom-text: #ECECEC;
  --loom-text-2: #A3A4A5;
  --loom-text-3: #6E6F70;

  /* 语义状态色 */
  --loom-green: #4FB477;
  --loom-green-soft: rgba(79, 180, 119, 0.16);
  --loom-amber: #D6A23C;
  --loom-amber-soft: rgba(214, 162, 60, 0.16);
  --loom-red: #E2645C;
  --loom-red-soft: rgba(226, 100, 92, 0.16);

  /* Agent 配色编码 */
  --loom-agent-codex: #10A37F;
  --loom-agent-claude: #D97757;
  --loom-agent-hermes: #7C5CFC;

  /* 圆角 */
  --loom-r-card: 10px;
  --loom-r-ctl: 8px;
  --loom-r-chip: 6px;

  /* 字号 */
  --loom-fs-title: 15px;
  --loom-fs-h: 16px;
  --loom-fs-body: 14px;
  --loom-fs-sm: 12.5px;
  --loom-fs-xs: 11.5px;
  --loom-fs-label: 11px;
  --loom-fs-mono: 13px;

  /* 字体 */
  --loom-font: "Inter", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --loom-mono: "Geist Mono", "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
}

/* 等宽终端/代码区域 */
.loom-mono {
  font-family: var(--loom-mono);
  font-size: var(--loom-fs-mono);
  line-height: 1.6;
}

/* Agent 头像基础样式 */
.loom-agent-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.02em;
}
.loom-agent-avatar.codex { background: var(--loom-agent-codex); }
.loom-agent-avatar.claude { background: var(--loom-agent-claude); }
.loom-agent-avatar.hermes { background: var(--loom-agent-hermes); }
.loom-agent-avatar.empty {
  background: var(--loom-surface-2);
  color: var(--loom-text-3);
  border: 1px dashed var(--loom-border-strong);
}

/* 状态圆点 */
.loom-status-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-accent: var(--loom-accent);
    --color-border: var(--loom-border);
    --color-sidebar: var(--loom-sidebar);
  }
  @layer base {
    body { background: var(--loom-surface); color: var(--loom-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- ===== Loom App Shell (shared fragment) =====
           固定全视口布局：左侧侧栏 + 右侧主区域，无整页滚动。
           4 个 SLOT 供叶子页替换：
             · mainContent       — 主工作区
             · activeNavItem     — 通过 data-nav-key 设定侧栏激活态
             · breadcrumbCurrent — 面包屑当前页名
             · miniStepperState  — 计划/实施/测试/完成 4 段状态
      -->
      <div class="loom-app">
        <!-- ---------- 侧栏 ---------- -->
        <aside class="loom-sidebar">
          <!-- Logo 行 -->
          <div class="sb-logo">
            <span class="sb-mark" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 3v18"/><path d="M20 3v18"/>
                <path d="M4 7h16"/><path d="M4 17h16"/>
              </svg>
            </span>
            <span class="sb-word">Loom</span>
          </div>

          <!-- 搜索行 -->
          <div class="sb-search">
            <div class="sb-search-input">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
              </svg>
              <span class="sb-search-ph">搜索任务…</span>
            </div>
            <button type="button" class="sb-add-project">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              <span>添加项目</span>
            </button>
          </div>

          <!-- 项目树 -->
          <nav class="sb-tree" aria-label="项目导航">
            <!-- 项目：loom（展开，激活） -->
            <div class="sb-project is-expanded is-active" data-nav-key="loom">
              <div class="sb-project-row">
                <svg class="sb-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m9 6 6 6-6 6"/>
                </svg>
                <svg class="sb-folder" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 7a2 2 0 0 1 2-2h3.2a2 2 0 0 1 1.4.6L12 6.8h6a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
                </svg>
                <span class="sb-project-name">loom</span>
                <span class="sb-count">4</span>
              </div>
              <div class="sb-tasks">
                <!-- 进行中 -->
                <div class="sb-task is-active" data-nav-key="loom-add-log-search">
                  <span class="loom-status-dot sb-dot sb-dot-progress" aria-label="进行中">
                    <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--loom-accent)" stroke-width="1.6"/><path d="M7 1.5A5.5 5.5 0 0 1 7 12.5Z" fill="var(--loom-accent)"/></svg>
                  </span>
                  <span class="sb-task-title">Add log search &amp; filter</span>
                  <span class="sb-task-time">3m</span>
                </div>
                <!-- 阻塞 -->
                <div class="sb-task" data-nav-key="loom-api-504">
                  <span class="loom-status-dot sb-dot sb-dot-blocked" aria-label="阻塞">
                    <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="var(--loom-red)"/><path d="M7 4v3.5M7 9.6v.4" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
                  </span>
                  <span class="sb-task-title">API 504 on /v1/assets</span>
                  <span class="sb-task-time">5h</span>
                </div>
                <!-- 测试中 -->
                <div class="sb-task" data-nav-key="loom-ios-ga">
                  <span class="loom-status-dot sb-dot sb-dot-testing" aria-label="测试中">
                    <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--loom-amber)" stroke-width="1.6"/><circle cx="7" cy="7" r="2.2" fill="var(--loom-amber)"/></svg>
                  </span>
                  <span class="sb-task-title">Fix iOS GA reporting</span>
                  <span class="sb-task-time">2h</span>
                </div>
                <!-- 已完成 -->
                <div class="sb-task" data-nav-key="loom-launch-screen">
                  <span class="loom-status-dot sb-dot sb-dot-done" aria-label="已完成">
                    <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="var(--loom-green)"/><path d="m4.6 7 1.8 1.8 3-3.2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                  <span class="sb-task-title">Optimize launch screen</span>
                  <span class="sb-task-time">1d</span>
                </div>
              </div>
            </div>

            <!-- 项目：speaker（折叠） -->
            <div class="sb-project is-collapsed" data-nav-key="speaker">
              <div class="sb-project-row">
                <svg class="sb-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m9 6 6 6-6 6"/>
                </svg>
                <svg class="sb-folder" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 7a2 2 0 0 1 2-2h3.2a2 2 0 0 1 1.4.6L12 6.8h6a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
                </svg>
                <span class="sb-project-name">speaker</span>
                <span class="sb-count">2</span>
              </div>
            </div>
          </nav>

          <!-- 设置入口（贴底） -->
          <div class="sb-settings">
            <button type="button" class="sb-settings-row" data-nav-key="settings">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
              </svg>
              <span>设置</span>
            </button>
          </div>
        </aside>

        <!-- ---------- 主区域 ---------- -->
        <div class="loom-main">
          <!-- 顶栏 -->
          <header class="loom-header">
            <div class="hd-left">
              <button type="button" class="hd-icon-btn" aria-label="收起侧栏" title="收起侧栏">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="2"/>
                  <path d="M9 4v16"/>
                </svg>
              </button>
              <nav class="hd-breadcrumb" aria-label="面包屑">
                <span class="hd-crumb hd-crumb-link">loom</span>
                <span class="hd-crumb-sep" aria-hidden="true">›</span>
                <!-- SLOT: breadcrumbCurrent — 叶子页替换为当前页名 -->
                <span class="hd-crumb hd-crumb-current"><!-- SLOT: breadcrumbCurrent --></span>
              </nav>
            </div>

            <div class="hd-spacer"></div>

            <!-- SLOT: miniStepperState — 4 段迷你步骤指示
                 默认全部 off（○）；叶子页替换为 ok/on/off 组合 -->
            <div class="hd-stepper" id="loom-mini-stepper">
              <!-- 默认 4 段全部 off；叶子页用 ok/on/off 替换 -->
              <span class="hd-step is-off" data-stage="plan">
                <svg class="hd-step-ico" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/></svg>
                <span>计划</span>
              </span>
              <span class="hd-step-sep" aria-hidden="true">·</span>
              <span class="hd-step is-off" data-stage="implement">
                <svg class="hd-step-ico" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/></svg>
                <span>实施</span>
              </span>
              <span class="hd-step-sep" aria-hidden="true">·</span>
              <span class="hd-step is-off" data-stage="test">
                <svg class="hd-step-ico" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/></svg>
                <span>测试</span>
              </span>
              <span class="hd-step-sep" aria-hidden="true">·</span>
              <span class="hd-step is-off" data-stage="done">
                <svg class="hd-step-ico" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/></svg>
                <span>完成</span>
              </span>
              <!-- SLOT: miniStepperState -->
            </div>

            <!-- 页面级动作插槽（叶子页按需填充） -->
            <div class="hd-actions" id="loom-header-actions"></div>
          </header>

          <!-- 主内容区 —— 叶子页替换此处 -->
          <div class="app-content">
            <!-- SLOT: mainContent -->
          </div>
        </div>
      </div>

      <!-- ===== Shell 专属样式（Free-explore 模式，置于 body 末尾） ===== -->
      <style>
        /* —— 应用骨架 —— */
        html, body { height: 100%; }
        body {
          background: var(--loom-bg);
          color: var(--loom-text);
          font-family: var(--loom-font);
          overflow: hidden; /* 桌面应用固定视口，整页不滚动 */
        }
        .loom-app {
          display: flex;
          width: 100vw;
          height: 100vh;
          overflow: hidden;
        }

        /* —— 侧栏 —— */
        .loom-sidebar {
          width: 256px;
          flex-shrink: 0;
          background: var(--loom-sidebar);
          border-right: 1px solid var(--loom-border);
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }
        .sb-logo {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 16px 16px 12px;
        }
        .sb-mark { color: var(--loom-accent); display: inline-flex; }
        .sb-word {
          font-size: var(--loom-fs-title);
          font-weight: 600;
          color: var(--loom-text);
          letter-spacing: -0.01em;
        }

        /* 搜索 + 添加项目 */
        .sb-search {
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 0 16px 12px;
        }
        .sb-search-input {
          display: flex;
          align-items: center;
          gap: 8px;
          height: 30px;
          padding: 0 10px;
          background: var(--loom-surface);
          border: 1px solid var(--loom-border);
          border-radius: var(--loom-r-ctl);
          color: var(--loom-text-3);
        }
        .sb-search-ph {
          font-size: var(--loom-fs-sm);
          color: var(--loom-text-3);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .sb-add-project {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          width: 100%;
          height: 28px;
          background: transparent;
          border: 1px dashed var(--loom-border-strong);
          border-radius: var(--loom-r-ctl);
          color: var(--loom-text-2);
          font-size: var(--loom-fs-sm);
          cursor: pointer;
          transition: background-color 140ms cubic-bezier(.2,.8,.2,1), border-color 140ms cubic-bezier(.2,.8,.2,1);
        }
        .sb-add-project:hover { background: var(--loom-hover); border-color: var(--loom-text-3); }
        .sb-add-project:active { background: var(--loom-selected); }

        /* —— 项目树 —— */
        .sb-tree {
          flex: 1;
          padding: 4px 8px 8px;
          overflow: hidden;
        }
        .sb-project { margin-bottom: 2px; }
        .sb-project-row {
          display: flex;
          align-items: center;
          gap: 6px;
          height: 28px;
          padding: 0 8px;
          border-radius: var(--loom-r-chip);
          cursor: pointer;
          color: var(--loom-text-2);
          transition: background-color 140ms cubic-bezier(.2,.8,.2,1);
        }
        .sb-project-row:hover { background: var(--loom-hover); }
        .sb-chevron { color: var(--loom-text-3); flex-shrink: 0; transition: transform 160ms cubic-bezier(.2,.8,.2,1); }
        .sb-folder { flex-shrink: 0; }
        .sb-project-name {
          font-size: var(--loom-fs-body);
          font-weight: 500;
          flex: 1;
          min-width: 0;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .sb-count {
          flex-shrink: 0;
          font-size: var(--loom-fs-label);
          color: var(--loom-text-3);
          background: var(--loom-surface);
          border-radius: var(--loom-r-chip);
          padding: 1px 6px;
          line-height: 1.4;
          font-variant-numeric: tabular-nums;
        }

        /* 激活项目：文件夹 + 名称高亮为 accent */
        .sb-project.is-active > .sb-project-row .sb-folder { color: var(--loom-accent); }
        .sb-project.is-active > .sb-project-row .sb-project-name { color: var(--loom-text); }
        .sb-project.is-active > .sb-project-row .sb-count {
          background: var(--loom-accent-soft);
          color: var(--loom-accent);
        }
        /* 展开态：chevron 旋转 90deg */
        .sb-project.is-expanded > .sb-project-row .sb-chevron { transform: rotate(90deg); }
        /* 折叠态隐藏任务列表 */
        .sb-project.is-collapsed > .sb-tasks { display: none; }

        /* —— 任务行 —— */
        .sb-tasks { padding: 2px 0 6px; }
        .sb-task {
          display: flex;
          align-items: center;
          gap: 8px;
          height: 28px;
          padding-left: 36px; /* 相对项目行再缩进 ~28px */
          padding-right: 8px;
          border-radius: var(--loom-r-chip);
          cursor: pointer;
          color: var(--loom-text-2);
          transition: background-color 140ms cubic-bezier(.2,.8,.2,1);
        }
        .sb-task:hover { background: var(--loom-hover); }
        .sb-task.is-active { background: var(--loom-selected); }
        .sb-task .sb-dot { flex-shrink: 0; }
        .sb-task-title {
          flex: 1;
          min-width: 0;
          font-size: var(--loom-fs-sm);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          color: var(--loom-text-2);
        }
        .sb-task.is-active .sb-task-title { color: var(--loom-text); }
        .sb-task-time {
          flex-shrink: 0;
          font-size: var(--loom-fs-label);
          color: var(--loom-text-3);
          font-variant-numeric: tabular-nums;
          font-family: var(--loom-mono);
        }

        /* —— 设置入口（贴底） —— */
        .sb-settings {
          margin-top: auto;
          padding: 8px 8px 12px;
          border-top: 1px solid var(--loom-border);
        }
        .sb-settings-row {
          display: flex;
          align-items: center;
          gap: 10px;
          width: 100%;
          height: 30px;
          padding: 0 10px;
          background: transparent;
          border: none;
          border-radius: var(--loom-r-chip);
          color: var(--loom-text-2);
          font-size: 13px;
          cursor: pointer;
          transition: background-color 140ms cubic-bezier(.2,.8,.2,1);
        }
        .sb-settings-row:hover { background: var(--loom-hover); }
        .sb-settings-row.is-active { background: var(--loom-selected); color: var(--loom-text); }

        /* —— 主区域 —— */
        .loom-main {
          flex: 1;
          min-width: 0;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        /* —— 顶栏 —— */
        .loom-header {
          height: 44px;
          flex-shrink: 0;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 0 16px;
          background: var(--loom-bg);
          border-bottom: 1px solid var(--loom-border);
        }
        .hd-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .hd-icon-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 28px;
          height: 28px;
          background: transparent;
          border: 1px solid transparent;
          border-radius: var(--loom-r-chip);
          color: var(--loom-text-2);
          cursor: pointer;
          flex-shrink: 0;
          transition: background-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1);
        }
        .hd-icon-btn:hover { background: var(--loom-hover); color: var(--loom-text); }
        .hd-icon-btn:active { background: var(--loom-selected); }

        .hd-breadcrumb {
          display: flex;
          align-items: baseline;
          gap: 6px;
          min-width: 0;
        }
        .hd-crumb {
          font-size: var(--loom-fs-sm);
          white-space: nowrap;
        }
        .hd-crumb-link { color: var(--loom-text-2); cursor: pointer; }
        .hd-crumb-link:hover { color: var(--loom-text); }
        .hd-crumb-sep { color: var(--loom-text-3); }
        .hd-crumb-current {
          color: var(--loom-text);
          font-weight: 500;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .hd-spacer { flex: 1; min-width: 0; }

        /* —— 迷你步骤指示 —— */
        .hd-stepper {
          display: flex;
          align-items: center;
          gap: 6px;
          flex-shrink: 0;
        }
        .hd-step {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          height: 22px;
          padding: 0 8px;
          border-radius: var(--loom-r-chip);
          font-size: var(--loom-fs-label);
          color: var(--loom-text-3);
          background: transparent;
          white-space: nowrap;
          font-weight: 500;
        }
        .hd-step .hd-step-ico { flex-shrink: 0; }
        .hd-step.is-ok { color: var(--loom-green); }
        .hd-step.is-on { color: var(--loom-accent); background: var(--loom-accent-soft); }
        .hd-step-sep { color: var(--loom-text-3); font-size: 10px; }

        .hd-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        /* —— 主内容容器 —— */
        .app-content {
          flex: 1;
          overflow: hidden; /* 内部滚动由叶子页决定 */
        }

        /* —— 全局通用工具（供叶子页复用） —— */
        .loom-mono { font-family: var(--loom-mono); }

        /* —— 触控/减少动效兜底 —— */
        @media (prefers-reduced-motion: reduce) {
          * { transition-duration: 0.01ms !important; }
        }
      </style>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
